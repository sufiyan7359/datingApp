<div class="auth-page d-flex align-items-center justify-content-center px-3 py-5">
  <div class="auth-card w-100 p-4 p-sm-5 rounded-4 shadow border-0">

    <div class="text-center mb-4">
      <div class="auth-icon mb-3"><i class="bi bi-heart-fill"></i></div>
      <h1 class="h3 mb-1"><b>Welcome <span class="textdanger">Back</span></b></h1>
      <p class="text-muted mb-0">Log in to keep the conversation going.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="loginData()" *ngIf="!twoFactorChallengeToken()">
      <div *ngIf="errorMessage()" class="alert alert-danger py-2">{{ errorMessage() }}</div>

      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" formControlName="loginEmail" placeholder="you@example.com" />
        <div class="text-danger small mt-1"
          *ngIf="loginForm.get('loginEmail').getError('required') != null && loginForm.get('loginEmail').touched">
          Email is required
        </div>
        <div class="text-danger small mt-1"
          *ngIf="loginForm.get('loginEmail').getError('email') != null && loginForm.get('loginEmail').touched">
          Invalid email format
        </div>
      </div>

      <div class="mb-2">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="loginPassword"
            placeholder="••••••••" />
          <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
        <div class="text-danger small mt-1"
          *ngIf="loginForm.get('loginPassword').getError('required') != null && loginForm.get('loginPassword').touched">
          Password is required
        </div>
      </div>

      <div class="text-end mb-4">
        <a routerLink="/forgot-password" class="auth-link small">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-danger w-100 py-2" [disabled]="isSubmitting()">
        <span *ngIf="!isSubmitting()">Login</span>
        <span *ngIf="isSubmitting()"><span class="spinner-border spinner-border-sm me-2"></span>Logging in…</span>
      </button>

      <p class="text-center text-muted mt-4 mb-0">
        New here? <a routerLink="/register" class="auth-link fw-semibold">Create your account</a>
      </p>
    </form>

    <div *ngIf="twoFactorChallengeToken()">
      <p class="text-muted text-center mb-4">Enter the 6-digit code from your authenticator app.</p>

      <div *ngIf="errorMessage()" class="alert alert-danger py-2">{{ errorMessage() }}</div>

      <div class="mb-4">
        <label class="form-label">Authenticator code</label>
        <input type="text" inputmode="numeric" maxlength="6" class="form-control text-center auth-code-input"
          [(ngModel)]="twoFactorCode" (keyup.enter)="submitTwoFactorCode()" placeholder="000000" />
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-danger flex-fill py-2" (click)="submitTwoFactorCode()"
          [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Verifying…' : 'Verify' }}
        </button>
        <button type="button" class="btn btn-outline-secondary flex-fill py-2" (click)="cancelTwoFactor()">
          Cancel
        </button>
      </div>
    </div>

  </div>
</div>
