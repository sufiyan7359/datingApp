<div class="container slide">

    <div class="row d-flex justify-content-center">


        <div class="col-4 d-none d-md-block bg-warning imgBack" style="z-index: -999 !important;">
        </div>



        <div class="col-12 col-md-7 mt-5 p-3 p-md-5">
            <div class="formDivhight">
                <h3 class="textdanger">
                    <b><u>Login</u></b>
                </h3>
                <form [formGroup]="loginForm" *ngIf="!twoFactorChallengeToken()">

                    <div class="form mt-4 mb-3">
                        <input type="email" formControlName="loginEmail" />
                        <label class="label-name"> E-mail </label>
                    </div>
                    <span
                        *ngIf="loginForm.get('loginEmail').getError('required')!=null && loginForm.get('loginEmail').touched "
                        class="textdanger ">Email is required</span>
                    <span
                        *ngIf="loginForm.get('loginEmail').getError('email')!=null && loginForm.get('loginEmail').touched "
                        class="textdanger ">Invalid Email formet</span>

                    <div class="form mt-4 mb-3">
                        <input type="{{ showPassword ? 'text' : 'password' }}" formControlName="loginPassword" />
                        <label class="label-name">Password</label>
                        <span class="content-name mb-2" (click)="togglePasswordVisibility()">{{ showPassword ? 'Hide
                            Password' : 'Show Password' }} </span>

                    </div>
                    <span
                        *ngIf="loginForm.get('loginPassword').getError('required')!=null && loginForm.get('loginPassword').touched "
                        class="textdanger">Password is required </span>

                    <div *ngIf="errorMessage()" class="textdanger mt-2">{{ errorMessage() }}</div>

                    <div class="form-group divaa mt-4 align-items-center">

                        <button type="submit" (click)="loginData()" class="btn btn-danger" [disabled]="isSubmitting()">
                            {{ isSubmitting() ? 'Logging in…' : 'Login' }}
                        </button>

                        <a class="newUser" routerLink="/register">Create your Dating account </a>
                    </div>
                    <div class="mt-2">
                        <a routerLink="/forgot-password">Forgot password?</a>
                    </div>
                </form>

                <div *ngIf="twoFactorChallengeToken()">
                    <p class="text-muted">Enter the 6-digit code from your authenticator app.</p>
                    <div class="form mt-4 mb-3">
                        <input type="text" inputmode="numeric" maxlength="6" [(ngModel)]="twoFactorCode"
                            (keyup.enter)="submitTwoFactorCode()" />
                        <label class="label-name">Authenticator code</label>
                    </div>

                    <div *ngIf="errorMessage()" class="textdanger mt-2">{{ errorMessage() }}</div>

                    <div class="form-group divaa mt-4 align-items-center">
                        <button type="button" (click)="submitTwoFactorCode()" class="btn btn-danger"
                            [disabled]="isSubmitting()">
                            {{ isSubmitting() ? 'Verifying…' : 'Verify' }}
                        </button>
                        <button type="button" class="btn btn-outline-secondary ms-2" (click)="cancelTwoFactor()">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>
