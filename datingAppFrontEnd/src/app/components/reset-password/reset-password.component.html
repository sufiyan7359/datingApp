<div class="auth-page d-flex align-items-center justify-content-center px-3 py-5">
  <div class="auth-card w-100 p-4 p-sm-5 rounded-4 shadow border-0">

    <div class="text-center mb-4">
      <div class="auth-icon mb-3"><i class="bi bi-shield-lock-fill"></i></div>
      <h1 class="h3 mb-1"><b>Reset <span class="textdanger">Password</span></b></h1>
      <p class="text-muted mb-0" *ngIf="token">Choose a new password for your account.</p>
    </div>

    <div *ngIf="errorMessage()" class="alert alert-danger py-2">{{ errorMessage() }}</div>

    <div *ngIf="token">
      <div class="mb-3">
        <label class="form-label">New password</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="newPassword"
            placeholder="••••••••" />
          <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Confirm new password</label>
        <div class="input-group">
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
            [(ngModel)]="confirmPassword" (keyup.enter)="submit()" placeholder="••••••••" />
          <button type="button" class="btn btn-outline-secondary" (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
            <i class="bi" [class.bi-eye]="!showConfirmPassword" [class.bi-eye-slash]="showConfirmPassword"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-danger w-100 py-2" [disabled]="isSubmitting()" (click)="submit()">
        <span *ngIf="!isSubmitting()">Reset password</span>
        <span *ngIf="isSubmitting()"><span class="spinner-border spinner-border-sm me-2"></span>Resetting…</span>
      </button>
    </div>

    <p class="text-center text-muted mt-4 mb-0">
      <a routerLink="/login" class="auth-link fw-semibold">Back to login</a>
    </p>
  </div>
</div>
