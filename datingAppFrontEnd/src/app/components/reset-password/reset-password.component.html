<div class="container mt-5 mb-5" style="max-width: 420px;">
  <h3><b>Reset password</b></h3>

  <div *ngIf="errorMessage()" class="alert alert-danger py-2">{{ errorMessage() }}</div>

  <div *ngIf="token">
    <div class="mb-3">
      <label class="form-label">New password</label>
      <input type="password" class="form-control" [(ngModel)]="newPassword" />
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm new password</label>
      <input type="password" class="form-control" [(ngModel)]="confirmPassword" (keyup.enter)="submit()" />
    </div>
    <button class="btn btn-danger" [disabled]="isSubmitting()" (click)="submit()">
      {{ isSubmitting() ? 'Resetting…' : 'Reset password' }}
    </button>
  </div>

  <p class="mt-3"><a routerLink="/login">Back to login</a></p>
</div>
