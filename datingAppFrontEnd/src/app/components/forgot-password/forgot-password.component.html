<div class="auth-page d-flex align-items-center justify-content-center px-3 py-5">
  <div class="auth-card w-100 p-4 p-sm-5 rounded-4 shadow border-0">

    <div class="text-center mb-4">
      <div class="auth-icon mb-3"><i class="bi bi-key-fill"></i></div>
      <h1 class="h3 mb-1"><b>Forgot <span class="textdanger">Password</span></b></h1>
      <p class="text-muted mb-0" *ngIf="!submitted()">
        Enter your account email and we'll send you a link to reset your password.
      </p>
    </div>

    <div *ngIf="!submitted()">
      <div class="mb-4">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" [(ngModel)]="email" (keyup.enter)="submit()"
          placeholder="you@example.com" />
      </div>
      <button class="btn btn-danger w-100 py-2" [disabled]="isSubmitting()" (click)="submit()">
        <span *ngIf="!isSubmitting()">Send reset link</span>
        <span *ngIf="isSubmitting()"><span class="spinner-border spinner-border-sm me-2"></span>Sending…</span>
      </button>
    </div>

    <div *ngIf="submitted()" class="text-center py-2">
      <div class="success-icon mb-3"><i class="bi bi-check-lg"></i></div>
      <p class="text-muted mb-0">If that email is registered, a reset link is on its way.</p>
    </div>

    <p class="text-center text-muted mt-4 mb-0">
      <a routerLink="/login" class="auth-link fw-semibold">Back to login</a>
    </p>
  </div>
</div>
