<div class="container mt-5 mb-5" style="max-width: 420px;">
  <h3><b>Forgot password</b></h3>

  <div *ngIf="!submitted()">
    <p class="text-muted">Enter your account email and we'll send you a link to reset your password.</p>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="email" (keyup.enter)="submit()" />
    </div>
    <button class="btn btn-danger" [disabled]="isSubmitting()" (click)="submit()">
      {{ isSubmitting() ? 'Sending…' : 'Send reset link' }}
    </button>
  </div>

  <div *ngIf="submitted()" class="alert alert-success">
    If that email is registered, a reset link is on its way.
  </div>

  <p class="mt-3"><a routerLink="/login">Back to login</a></p>
</div>
